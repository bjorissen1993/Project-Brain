services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: projectbrain
      POSTGRES_PASSWORD: projectbrain
      POSTGRES_DB: projectbrain
    volumes:
      - project_brain_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectbrain -d projectbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  project_brain_pg:
